<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="icon" type="image/x-icon" href="../img/favicon_sistema.ico">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="4;url=/login/login.html">
  <title>Gracias por usar el sistema</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      display: grid;
      min-height: 100vh;
      place-items: center;
      margin: 0;
      padding: 24px;
      color: #1f2937;
      background: #f3f4f6;
    }

    .logout-card {
      width: min(100%, 460px);
      padding: 40px 32px;
      text-align: center;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      box-shadow: 0 12px 30px rgba(17, 24, 39, 0.1);
      animation: logout-card-enter 420ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }

    .logout-card.is-leaving {
      animation: logout-card-exit 300ms ease-in both;
    }

    .logout-icon {
      display: grid;
      width: 58px;
      height: 58px;
      margin: 0 auto 20px;
      place-items: center;
      color: #111827;
      background: #fef3c7;
      border-radius: 50%;
      animation: logout-icon-enter 420ms 100ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }

    .logout-icon svg {
      width: 28px;
      height: 28px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 2;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 24px;
      animation: logout-text-enter 350ms 120ms ease-out both;
    }

    p {
      margin: 0;
      color: #6b7280;
      line-height: 1.6;
      animation: logout-text-enter 350ms 190ms ease-out both;
    }

    @keyframes logout-card-enter {
      from {
        opacity: 0;
        transform: translateY(16px) scale(0.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes logout-card-exit {
      to {
        opacity: 0;
        transform: translateY(-12px) scale(0.985);
      }
    }

    @keyframes logout-icon-enter {
      from {
        opacity: 0;
        transform: scale(0.7);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes logout-text-enter {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .logout-card,
      .logout-card.is-leaving,
      .logout-icon,
      h1,
      p {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <main class="logout-card">
    <div class="logout-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>
    </div>
    <h1>¡Gracias por usar el sistema!</h1>
    <p>Tu sesión ha finalizado. En unos segundos volverás al inicio de sesión.</p>
  </main>
  <script src="/eel.js"></script>
  <script src="logout.js"></script>
</body>
</html>
